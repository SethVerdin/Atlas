name: CI

# Runs on every pull request (any target branch) and on pushes to main.
# To block merges when a check fails, a repo admin marks the "api" and "app"
# checks as required for main (see README > Continuous integration).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # An empty PostgreSQL (same version as docker-compose.yml) for the Migrations step.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      # Builds the schema from every migration on an empty database, then runs again
      # to check that nothing is applied twice.
      - name: Migrations
        run: npm run migrate && npm run migrate
        env:
          DB_PORT: "5432"
          DB_PASSWORD: ci_only
      - name: Validate docker-compose.yml
        working-directory: .
        run: cp .env.example .env && docker compose config --quiet

  app:
    name: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      # Offline, expo-doctor checks packages against the Expo SDK installed from the
      # lockfile, so the result only changes when the repo does. Online it compares
      # against Expo's newest patch releases, which failed every PR whenever Expo
      # shipped a patch. To pick up new patches: `npx expo install --fix` in app/.
      - name: Expo dependency check
        run: npx expo-doctor
        env:
          EXPO_OFFLINE: "1"
